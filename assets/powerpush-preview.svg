<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600" role="img" aria-labelledby="title desc">
  <title id="title">Illustrative PowerPush dashboard preview</title>
  <desc id="desc">A dark mobile fitness dashboard mockup showing 64 of 100 daily reps, a 3-day streak, workout metrics, and recent activity.</desc>
  <rect width="900" height="600" rx="28" fill="#101216"/>
  <text x="56" y="72" fill="#b7ff00" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="3">POWERPUSH</text>
  <text x="56" y="119" fill="#ffffff" font-family="Arial,sans-serif" font-size="32" font-weight="700">Your daily movement,</text>
  <text x="56" y="158" fill="#ffffff" font-family="Arial,sans-serif" font-size="32" font-weight="700">made measurable.</text>
  <text x="56" y="192" fill="#a4a8b0" font-family="Arial,sans-serif" font-size="16">Illustrative dashboard preview · Local-first workout tracking</text>
  <rect x="250" y="220" width="400" height="330" rx="34" fill="#171b22" stroke="#343943" stroke-width="2"/>
  <rect x="388" y="234" width="124" height="8" rx="4" fill="#353a44"/>
  <text x="280" y="284" fill="#a4a8b0" font-family="Arial,sans-serif" font-size="15">Good morning</text>
  <text x="280" y="316" fill="#ffffff" font-family="Arial,sans-serif" font-size="24" font-weight="700">PowerPush</text>
  <rect x="280" y="338" width="340" height="126" rx="22" fill="#20252d"/>
  <circle cx="344" cy="401" r="39" fill="none" stroke="#414751" stroke-width="9"/>
  <circle cx="344" cy="401" r="39" fill="none" stroke="#b7ff00" stroke-width="9" stroke-linecap="round" stroke-dasharray="157 245" transform="rotate(-90 344 401)"/>
  <text x="344" y="400" fill="#ffffff" font-family="Arial,sans-serif" font-size="23" font-weight="700" text-anchor="middle">64</text>
  <text x="344" y="419" fill="#a4a8b0" font-family="Arial,sans-serif" font-size="11" text-anchor="middle">REPS</text>
  <text x="408" y="376" fill="#a4a8b0" font-family="Arial,sans-serif" font-size="14">DAILY TARGET</text>
  <text x="408" y="409" fill="#ffffff" font-family="Arial,sans-serif" font-size="27" font-weight="700">100 reps</text>
  <rect x="408" y="421" width="117" height="27" rx="13" fill="#303725"/>
  <text x="466" y="440" fill="#b7ff00" font-family="Arial,sans-serif" font-size="12" font-weight="700" text-anchor="middle">🔥  3 day streak</text>
  <rect x="280" y="479" width="160" height="50" rx="14" fill="#20252d"/>
  <rect x="450" y="479" width="170" height="50" rx="14" fill="#20252d"/>
  <text x="298" y="500" fill="#a4a8b0" font-family="Arial,sans-serif" font-size="11">TOTAL REPS</text>
  <text x="298" y="520" fill="#ffffff" font-family="Arial,sans-serif" font-size="19" font-weight="700">64</text>
  <text x="468" y="500" fill="#a4a8b0" font-family="Arial,sans-serif" font-size="11">PERSONAL BEST</text>
  <text x="468" y="520" fill="#ffffff" font-family="Arial,sans-serif" font-size="19" font-weight="700">82 reps</text>
  <text x="56" y="565" fill="#777e89" font-family="Arial,sans-serif" font-size="13">Concept artwork; not captured from a running app.</text>
</svg>
